version: 2
updates:
  # Backend (Node.js / npm)
  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # App Flutter (pub)
  - package-ecosystem: "pub"
    directory: "/app"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # GitHub Actions (au cas ou il y en aurait un jour)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
