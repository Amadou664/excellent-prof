name: CI

# Tourne a chaque push et sur chaque Pull Request (y compris celles ouvertes automatiquement par
# Dependabot) : verifie que le code compile et que les tests passent AVANT que ce soit merge ou
# deploye. Un echec ici bloque visuellement la PR sur GitHub (case rouge), pour ne jamais decouvrir
# une regression une fois deja en production.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc -p tsconfig.json --noEmit
      - run: npm test

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.2"
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
